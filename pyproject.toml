[project]
name = "population-pyramid-explorer"
version = "0.1.0"
description = "Find any country's demographic twins and opposites: population-pyramid similarity search on UN World Population Prospects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "duckdb>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6"]
econ = ["yfinance>=0.2.50", "statsmodels>=0.14"]
embed = [
    "torch>=2.13,<2.15",
    "transformers>=5.13,<6",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-corpus evaluations (deselect with -m 'not slow')",
    "network: needs internet (skipped by default)",
    "embed: needs the embed dependency group",
]
addopts = "-m 'not network'"

[tool.uv.build-backend]
module-name = "pyramid_explorer"

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"
