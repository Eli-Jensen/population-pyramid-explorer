# Demographic-dividend stage per (country, year) — thresholds for pyramid_explorer.econ.typology.
#
# Source of the rule (VERIFIED 2026-09-04 from the PDF text, Table 1 "Criteria for Typology", p. 11):
#   Ahmed, S. A., M. Cruz, B. Quillin and P. Schellekens (2016). "Demographic Change and Development: A Global
#   Typology". World Bank Policy Research Working Paper 7893 (the typology of the Global Monitoring Report
#   2015/2016 "Development Goals in an Era of Demographic Change").
#   https://documents1.worldbank.org/curated/en/867951479745020851/pdf/WPS7893.pdf
#   Table 1 (verbatim structure): rows = growth of the working-age (15–64) population SHARE 2015–30 (<= 0 / > 0);
#   columns = total fertility rate 1985 (< 2.1 / >= 2.1) for the non-growing row, total fertility rate 2015
#   (< 4 / >= 4) for the growing row →
#     share change <= 0 and TFR(1985) <  2.1  → post-dividend
#     share change <= 0 and TFR(1985) >= 2.1  → late-dividend
#     share change >  0 and TFR(2015) <  4    → early-dividend
#     share change >  0 and TFR(2015) >= 4    → pre-dividend
#   The paper motivates 30 years as "the approximate length of time that defines a generation" and the 15-year
#   projection window as the 2030 Agenda horizon (footnote 9). Population data: UN WPP 2015 Revision, medium variant.
#
# ADAPTED here to every year y (the report classifies 2015 only):
#   * the 15-year look-ahead is y → y + 15 from the WPP 2024 medium variant (estimates through 2023);
#   * the "generation ago" fertility is TFR(y − 30) from WPP 2024 (the report used the 1985 value for 2015);
#   * for y < 1980 the generation-ago TFR (year < 1950) is not observed, so a country whose working-age share is
#     NOT growing over the next 15 years gets stage 0 = n/a rather than a guessed late/post split (the growing
#     branch needs only TFR(y) and is assigned normally);
#   * the WPP vintage differs (2024 vs 2015), so borderline 2015 cases may move — see `reproduction_2015`.
# Nothing here says what a stage implies for growth or markets; it is a demographic descriptor.

version: 1
source:
  citation: "Ahmed, Cruz, Quillin & Schellekens (2016), World Bank PRWP 7893, Table 1; GMR 2015/2016 typology"
  url: https://documents1.worldbank.org/curated/en/867951479745020851/pdf/WPS7893.pdf
  verified: true
  verified_on: "2026-09-04"
  adapted: true

thresholds:
  working_age_lo: 15            # inclusive, years
  working_age_hi: 64            # inclusive, years (5-year bins: 15–19 … 60–64)
  horizon_years: 15             # working-age share change y → y + horizon (report: 2015 → 2030)
  share_change_growing: "> 0"   # percent change of the share; "<= 0" = not growing
  generation_years: 30          # TFR looked up at y − 30 (report: 1985 for 2015)
  tfr_replacement: 2.1          # post (< 2.1) vs late (>= 2.1) on TFR(y − 30)
  tfr_high: 4.0                 # early (< 4) vs pre (>= 4) on TFR(y)
  missing_generation_tfr: "n/a" # stage 0 when TFR(y − 30) is unobserved and the share is not growing

codes: {0: n/a, 1: pre, 2: early, 3: late, 4: post}

# Reproduction target: WPS7893 Table A1 (annex, pp. 39–44), hand-transcribed from the PDF text on 2026-09-04
# (columns: type, % change in working-age share 2015–30, TFR 1985, TFR 2015; WPP 2015 Revision numbers).
# `test_econ_export.py::test_typology_reproduces_2015_assignments` asserts the 20 `named` countries and reports
# the agreement rate over the whole table; differences trace to the WPP 2015 → 2024 revision, not to the rule.
reproduction_2015:
  named: [CHN, IND, BRA, COD, DEU, JPN, NGA, BGD, VNM, THA, KOR, MEX, IDN, EGY, PAK, ZAF, USA, PHL, ITA, NPL]
  # Observed on 2026-09-04 with WPP 2024: 112 of the 132 transcribed rows reproduce (85 %). The 20 that do not are
  # all within a hair of a threshold in the report's own numbers or moved by the WPP 2015 → 2024 revision, e.g.
  # RUS (TFR 1985 2.12 in WPP 2015 vs < 2.1 in WPP 2024 → post, not late), UZB (working-age share now projected to
  # fall 2015–30 after the fertility rebound → late, not early), KEN / ETH / RWA / YEM (TFR 2015 revised across 4.0),
  # COL / IRL / MYS / MAR / URY / ARE / KWT / JAM / FJI (share change within ±5 pp of zero, sign flipped by the
  # revision), LVA / SRB (TFR 1985 across 2.1), DZA / IRN (share change sign), TLS (TFR 2015 5.33 → 3.78).
  min_agreement_rate: 0.8
  table_a1:
