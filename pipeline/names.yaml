# Keys are ISO3 for countries and `agg-<locid>` for aggregates. `slug` = slugify(short_name); both the
# UN-name slug and the short-name slug are aliases automatically, plus ISO3/ISO2. Build fails on any
# duplicate slug or alias across entities.
