# Automatic aliases to remove (a UN-name slug that collides with another entity's slug).
drop_aliases:
  agg-954: [micronesia]   # the country FSM owns 'micronesia'; the subregion keeps 'micronesia-subregion'
# Aggregates of the six kept LocTypeNames that are NOT entities, with the reason (PLAN §3.2).
deny_aggregates:
  1518: no income group available (residual bucket, 12 territories)
  5502: Europe + Northern America + Australia/New Zealand union of two SDG regions
  5503: high-and-upper-middle income union
  5504: low-and-lower-middle income union
  1859: low-and-middle income union
  1517: middle income union
  934: less developed excluding least developed ("excluding" variant)
  948: less developed excluding China ("excluding" variant)
  5505: Americas (keep 904 Latin America and the Caribbean + 905 Northern America)
  1836: SDG Australia/New Zealand is identical to subregion 927 (same two members, same name)
  1830: SDG Latin America and the Caribbean is identical to geographic region 904 (same members, same name)
