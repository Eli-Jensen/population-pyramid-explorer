# Country market events and classification facts used by pyramid_explorer.econ.instruments (plan §7, M5.4).
# Hand-curated; every entry names its source and whether it was read on the day ([V] verified: true) or comes from
# memory / secondary reporting ([M] verified: false). Facts only — no series, no prices, no judgement about the future.
# `note` = the wording shipped inside econ.*.ecz (no provider name — the shipped-data guard); `detail` = the full fact for
# evidence.json. `mobility` is derived by instruments.py from the class + events (standalone or an index deletion → closed; FM with a
# repatriation event → restricted; EM / DM → open; everything else → not_assessed) and is never hand-set here.

version: 1
as_of: "2026-09-04"

# Index-provider market classification snapshot for countries WITHOUT a US-listed single-country fund in
# evals/econ/etf_universe.yaml (funds carry their own msci_class there). Source: docs/research/econ_evidence.md
