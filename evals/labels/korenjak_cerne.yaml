fallback_status: rung1_2008_lists
primary_year: 2006
vintage: US Census IDB (2008), 17 bins/sex, 80+ open
vintage_sensitivity_row: omitted — IDB-2008 totals unavailable
cluster_meaning:
  A: expansive (DTM stage 1)
  B: stage 2–3
  C: stage 3–4 (incl. Gulf male-surplus states in 1996/2006)
  D: stage 4 (aged)
