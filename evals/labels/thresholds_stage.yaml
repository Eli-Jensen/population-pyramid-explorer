# G2(c) — textbook expansive / stationary / constrictive stage thresholds (populationpyramids.org guide, quoted).
# Operational rule used by pyramid_explorer.features.stage: expansive if median age < 25, constrictive if ≥ 40,
# stationary otherwise (the guide's 35–40 stationary band leaves 25–35 unnamed; we fill it as stationary).
# Vintage: thresholds are timeless; the guide's example figures refer to ~2024 data.
retrieved: '2026-09-04'
written_by: scripts/fetch_labels.py
source:
  citation: 'populationpyramids.org, ''3 Types of Population Pyramids: Complete Guide to Understanding Population Structure'',
    2024-11-12.'
  url: https://www.populationpyramids.org/blog/population-pyramid-types-complete-guide
vintage: guide dated 2024-11-12; examples ≈ 2024 figures
operational_rule:
  expansive: median_age < 25
  stationary: 25 ≤ median_age < 40
  constrictive: median_age ≥ 40
guide:
  expansive:
    median_age: < 25
    tfr: '> 2.5'
    growth_pct_yr: 2-4
    quotes:
    - 'Birth rates: Usually above 2.5 children per woman'
    - 'Median age: Typically under 25 years'
    - 'Growth rate: Often 2-4% annually'
    examples:
      NGA: 47% of population under 15, growing 2.6% annually
      UGA: 48% under 15, median age just 16.7 years
      NER: 50% under 15, world's highest birth rate
      COD: 46% under 15
  stationary:
    median_age: 35-40
    tfr: ≈ 2.1
    growth_pct_yr: 0-0.5
    quotes:
    - 'Fertility rate: Around 2.1 children per woman'
    - Population growth near 0-0.5% annually
    - 'Median age: Usually 35-40 years'
    examples:
      USA: 1.7 fertility rate, gradual aging transition
      FRA: 1.8 fertility rate, balanced immigration
      GBR: 1.6 fertility rate, stable population
      CAN: 1.5 fertility rate, immigration maintains growth
  constrictive:
    median_age: 40+
    tfr: < 2.1
    growth_pct_yr: null
    quotes:
    - 'Fertility rate: Under 2.1 children per woman'
    - 'Median age: Often 40+ years'
    examples:
      JPN: 1.3 fertility rate, 29% over 65, declining since 2010
      KOR: 0.8 fertility rate, world's lowest
      ITA: 1.2 fertility rate, 23% over 65
      DEU: 1.5 fertility rate, aging rapidly
