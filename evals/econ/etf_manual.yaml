# Manual NAV ladder for the delisted / liquidating funds of evals/econ/etf_universe.yaml (PREREG.md §6,
# guard assertion 4). Hand-transcribed on 2026-09-04 from SEC filings (N-CSR financial highlights,
# 485BPOS calendar-year bar charts tagged rr:AnnualReturnYYYY, 497 supplements, N-PORT Item B.5.a monthly
# total returns) and issuer liquidation notices. Every number carries the URL that was actually read.
#
# Conventions
#   tr_nav      : calendar-year NAV total return as a FRACTION (0.123 = +12.3 %), distributions reinvested
#                 at NAV as the issuer computes it. Only FULL calendar years appear in `years`; null = not
#                 found (E1's window_return treats it as 'manual_incomplete').
#   method      : ncsr_fh      = "Total return" row of the fund's financial-highlights table (fiscal year =
#                                calendar year; VanEck ETF Trust only)
#                 485bpos_bar  = "Annual Total Returns (Years Ended December 31)" bar chart of the annual
#                                prospectus update, read from the iXBRL tag rr:AnnualReturnYYYY
#                 nport_compound = product of (1 + monthly total return) over the 12 N-PORT monthly returns
#                                (Item B.5.a rtn1..rtn3; rtn1 = first month of the reporting quarter,
#                                rtn3 = the period-end month; order verified on ERUS 2022-02: Feb = -80.43 %)
#   partial_periods : stub periods (inception year, final year to liquidation) kept OUT of `years`; values
#                 marked derived=true are arithmetic on two transcribed numbers, never a transcription.
#   distributions   : liquidating distributions only (regular income dividends are inside tr_nav).
#
# IMPORTANT for the window arithmetic (E1): once a fund's holdings are marked at ~0 and it pays a series
# of liquidating distributions on a residual NAV of a few cents (ERUS from 2022-08, RSX from 2023-01), the
# issuer's "total return" figures assume each distribution is REINVESTED at the residual NAV — impossible
# for a fund closed to purchases. For those years tr_nav is either null (ERUS) or transcribed but flagged
# reinvestment_artifact=true (RSX). The economically meaningful path is the cash ladder given under
# `cash_ladder`: value per original share = NAV at the last regular year-end x (1 + tr_nav to the halt
# year) then + the distributions received, held at 0 % nominal, plus any residual NAV.
#
# Deviations from etf_universe.yaml found while transcribing (recorded here; the universe file is frozen,
# RESULTS.md "Deviations from PREREG" must list them):
#   NGE: last trading day was 2024-03-25, not 2023-07-28. The 2023-06-22 press release said 2023-07-28,
#        but 497 supplements dated 2023-07-14 / 2023-08-07 / 2023-09-19 / 2024-03-01 moved the closing
#        date to 2023-08-18, then 2023-09-28, then 2024-03-25; the fund was still in the 2024-02-28
#        485BPOS with a 2023 calendar-year return. Yahoo's stale bar dated 2024-03-25 was therefore right.
#        Consequence: NGE 2023 is a FULL year (-27.27 %), and liquidation fell on 2024-03-29.
#   RSX: universe says distributions "2024-04-19, 2024-10-07, 2024-12-24" - confirmed, amounts added; an
#        additional $0.0119 was declared 2025-12-22 (held by DTCC pending an OFAC licence).
#   ERUS: universe knows only the 2022-08-17 distribution; four more were paid 2023-12-27 .. 2024-12-20
#        totalling $4.066 per share (BlackRock product page), and NAV was $0.0352 on 2026-09-03.

version: 1
as_of: "2026-09-04"
prereg: evals/econ/PREREG.md
universe: evals/econ/etf_universe.yaml
transcriber: E3 (manual NAV ladder subagent), 2026-09-04

# Structured copy of the deviations above for decide_econ.py → RESULTS.md §10 (the universe file is frozen).
prereg_deviations:
  - "NGE delisting date: etf_universe.yaml (frozen) says 2023-07-28; 497 supplements dated 2023-07-14 / 2023-08-07 / 2023-09-19 / 2024-03-01 moved the closing date to 2024-03-25 (liquidation ~2024-03-29), so NGE 2023 is a full calendar year (-27.27 %) and the window arithmetic uses 2024-03-25. Yahoo's stale bar dated 2024-03-25 was the real last trade; the PREREG §6 remark about a bar 'eight months after the real last trade' was wrong about the date, not about the routing."
  - "ERUS / RSX liquidating distributions: the universe knows only ERUS 2022-08-17 and the three RSX 2024 dates; four more ERUS distributions (2023-12-27, 2024-06-17, 2024-11-06, 2024-12-20; $4.098728/share in total incl. 2022) and RSX $0.0119 declared 2025-12-22 (held at DTCC pending an OFAC licence) were transcribed. Issuer 'total return' figures after the trading halts assume reinvestment at a residual NAV of cents (RSX 2023 +296.65 %, 2024 +421.94 %) and are flagged reinvestment_artifact — the window arithmetic uses the cash_ladder (NAV at the last regular year-end, then distributions as 0 % cash plus residual NAV) instead of compounding them."
  - "Sources beyond N-CSR + liquidation notice (PREREG §6 names those two): PAK 2023 (+27.914 %) and ERUS 2022 (-99.844 %) and 2025 (+4.615 %) are twelve N-PORT Item B.5.a monthly returns compounded; NGE / PAK / FM / ERUS calendar years come from 485BPOS prospectus bar charts (iXBRL rr:AnnualReturnYYYY); EGPT and RSX from N-CSR financial highlights."
  - "Not available from any issuer source: FM 2024 (December N-PORT never filed; 2024 null → the 2024-01-01..2025-01-09 span is a ladder gap), the NGE (2024-03-29) and PAK (2024-02-23) cash-out NAVs per share (final stubs after 2024-01-31 are ladder gaps), and an ERUS 2021-12-31 NAV (so the ERUS cash ladder cannot be expressed in return space after 2022; the 2022 -99.844 % mark is applied and the post-halt span is a ladder gap). Ladder gaps are held at 0 % and reported, never dropped."

