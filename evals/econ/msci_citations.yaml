# MSCI index FACTS, hand-transcribed from the current MSCI factsheet PDFs — never series.
# Pre-registered companion of PREREG.md (Experiment 3, disconnect table). Each number is copied exactly
# as printed on the factsheet named by `url`; nothing is computed, rounded or interpolated here.
# MSCI publishes a GROSS and a NET (USD) factsheet per index; each carries its own "Since <date>" base for
# the annualised column and a separate "was launched on" footnote date — both are transcribed.
# Risk figures are "based on monthly gross returns data" on the gross sheet and "monthly net returns data"
# on the net sheet (as labelled on-sheet). Nothing here changes after the ETF fetch (PREREG.md §0).
# All sheets accessed 2026-09-04; all "as of AUG 31, 2026" (page header + "INDEX PERFORMANCE (AUG 31, 2026)").
# Transcription method: PDF text extraction (pdftotext -layout) of the downloaded factsheet; the figures
# below were read from that text. Verification status per index: verified = transcribed from the PDF;
# unverified = could not be fetched (none in this file).

version: 1
accessed: 2026-09-04
as_of: 2026-08-31
currency: USD
column_order: [1y, 3y, 5y, 10y, since]
note_on_use: >-
  The disconnect table uses the GROSS sheet's "since" figure when the base date precedes the net series
  (Dec 29, 2000) and reports the net figure alongside; the UI prints the base date next to every number.
  The China row cited in docs/PLAN.md §7 (MSCI China +1.55 %/yr since 1992-12-31, −88.6 % drawdown) is the
  gross sheet below.
caveat_urls: >-
  Do NOT cite https://www.msci.com/documents/10199/255599/msci-emerging-markets-index-usd-gross.pdf — despite
  its slug it resolves to the "MSCI EM 4-Factor Select Long Only Index" factsheet, not the MSCI EM Index.

