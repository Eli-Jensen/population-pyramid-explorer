# Issuer-published annualised NAV total returns, hand-transcribed on 2026-09-04 — the cross-check for the
# Yahoo adjusted-close series (PREREG.md §6, last bullet). Pre-registered companion of PREREG.md; nothing
# here changes after the ETF fetch. Facts only (a handful of published percentages with their URL); no series.
#
# The check: for every entry with verified: yes, `scripts/fetch_etf.py` computes the annualised total return
# from Yahoo adjusted closes over the identical period — 10 years ending at `as_of` (first bar on or before
# as_of minus 10 years) and, for `since_inception`, from the first available bar to `as_of` — and the build
# fails unless |computed - published| <= tolerance_pp for the 10y figure and for every other figure listed
# under `check`. Since-inception figures are compared where the first Yahoo bar is within 45 days of the
# issuer inception (guard assertion 2); the few-day start offset is well inside the tolerance for these
# multi-decade windows. All figures are NAV total returns with distributions reinvested, in USD, annualised.
# Yahoo's adjusted close reflects market price, not NAV; the tolerance absorbs premium/discount drift.

version: 1
accessed: "2026-09-04"
tolerance_pp: 0.5
currency: USD
basis: NAV total return, distributions reinvested, average annual (%)
column_order: [1y, 3y, 5y, 10y, since_inception]

