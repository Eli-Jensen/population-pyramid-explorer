# ETF universe for the economic-lens backtest — hand-curated BEFORE any price fetch (PREREG.md §6).
# Pre-registered companion of PREREG.md. Nothing here changes after `scripts/fetch_etf.py` runs for the
# first time: NO ticker is added or removed; a date found wrong later is recorded in the "Deviations from
# PREREG" section of evals/econ/RESULTS.md, never edited here.

version: 1
as_of: "2026-09-04"
prereg: evals/econ/PREREG.md

rules: >-
  Summary of PREREG.md §3.4 and §6 (the PREREG text governs). Investable at T iff `inception` <= the entry
  date (last NYSE trading day of calendar year T). A country with several funds uses the one with the
  earliest inception that is still <= entry (CHN: FXI for T <= 2010, MCHI otherwise duplicates it; IND: EPI
  for T = 2010, INDA is a duplicate; RUS: RSX, ERUS duplicates it). Windows that run past a fund's last
  trading day compound to that day (calendar-year NAV ladder in evals/econ/etf_manual.yaml) and are held at
  0 % nominal cash thereafter, flagged liquidated_in_window. Liveness comes ONLY from `delisted: null` here
  AND guard assertion 3 (last bar >= today - 10 days); a Yahoo quote is never evidence of life. Guard per
  ticker: n_bars >= 250; first bar <= inception + 45 days; live => last bar >= today - 10 days;
  delisted => Yahoo refused (one stale bar or no data at all — see `yahoo_note`) and the ticker is routed to
  etf_manual.yaml; no gap > 45 days. Benchmarks (role: benchmark) are never picks. role: basket (FM) is a
  multi-country fund kept only as a liquidation/stale-bar fixture; it is never a pick and is excluded from
  the equal-weight single-country basket.

field_notes:
  ticker: the US listing ticker as used in the plan (see yahoo_symbol where Yahoo's symbol differs)
  iso3: ISO 3166-1 alpha-3 of the country; WORLD / DM_EX_US / EM / USA for benchmarks; null for the basket
  inception: issuer inception date (YYYY-MM-DD)
  inception_verified: "yes = read on 2026-09-04 from the issuer's own page, fact sheet or SEC filing named in source_url; no = best-known date from secondary sources (issuer site not reachable by automated fetch)"
  yahoo_first_bar: >-
    month (YYYY-MM) of the first bar returned by Yahoo Finance chart v8 range=max&interval=1mo on
    2026-09-04. The raw endpoint answered HTTP 429 for every request from this network that day; the same
    endpoint was read through yfinance's cookie/crumb session instead (identical data source). null when
    Yahoo returned no usable history (delisted tickers).
  discrepancy_days: >-
    first Yahoo DAILY bar minus issuer inception, in days, where the daily first bar was checked (THD,
    COLO/GXG, NORW); otherwise 0 when the first monthly bar falls in the inception month, else the days from
    inception to the first day of that month. Negative = Yahoo history predates the issuer inception.
    null when no usable Yahoo history. The daily fetch recomputes the exact figure (guard assertion 2).
  status: live | liquidated (final distribution paid) | liquidating (delisted, distributions continuing)
  delisted: last day the shares traded on the listing exchange (or the exchange's suspension date); null if live
  status_url: issuer or exchange document for the liquidation (press release, SEC filing, Form 8937)
  msci_class: >-
    MSCI market classification of the country as known to the author on 2026-09-04 (DM | EM | FM |
    standalone | none | n/a for benchmarks/basket). Informational only; no test reads it.
  yahoo_symbol: only present when Yahoo's symbol differs from `ticker` (COLO for GXG after the 2025-06 rename)

yahoo_note: >-
  Observed 2026-09-04: the liquidated tickers do NOT all show the same refusal signature. EGPT, NGE, PAK and
  FM return exactly ONE stale bar (dates 2024-03-21, 2024-03-25, 2025-06-11, 2025-01-06 respectively — for
  NGE and PAK that date is months AFTER the real last trading day, which is exactly why a stale bar must
  never be read as liveness or as a liquidation date). ERUS and RSX return NO data at all through yfinance
  ("possibly delisted; no price data found"), while the raw chart endpoint returned one stale bar for them
  earlier the same day (PREREG.md §6). The guard's "Yahoo refused" branch must therefore accept both
  signatures (a single bar OR an empty result); both route the ticker to etf_manual.yaml.

